# Local-only Cloudflare shape. This file contains no production identifiers or secrets.
# Local D1 state is stored below .wrangler/ and is ignored by Git.

#:schema node_modules/wrangler/config-schema.json
name = "reg-allgemein-local"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_ENV = "development"
PORTAL_PUBLIC_ORIGIN = "http://127.0.0.1:5173"
AUTH_PUBLIC_ENABLED = "false"
EMAIL_PROVIDER = "fake"
PRIVACY_NOTICE_VERSION = "local-synthetic-notice-v1"
DOCUMENT_UPLOAD_ENABLED = "false"
DOCUMENT_MAX_FILE_BYTES = "10485760"
DOCUMENT_MAX_FILES_PER_AUTHORIZATION = "5"
DOCUMENT_MAX_AUTHORIZATION_BYTES = "26214400"
DOCUMENT_UPLOAD_RATE_LIMIT_WINDOW_SECONDS = "60"
DOCUMENT_UPLOAD_RATE_LIMIT_MAX_ATTEMPTS = "5"
DOCUMENT_AV_ATTESTATION_TEXT_VERSION = "manual-local-av-v1"

[[d1_databases]]
binding = "DB"
database_name = "reg-allgemein-local"
database_id = "local-reg-allgemein"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "reg-allgemein-local-documents"
