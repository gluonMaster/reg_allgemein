# Copy to wrangler.toml after creating Cloudflare resources.
# Do not commit real database ids, bucket names for production, or secrets.

#:schema node_modules/wrangler/config-schema.json
name = "reg-allgemein"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".svelte-kit/cloudflare/assets"
binding = "ASSETS"

[browser]
binding = "BROWSER"

[vars]
# Requests fail closed until every replace/example value is configured.
APP_ENV = "production"
PORTAL_PUBLIC_ORIGIN = "https://portal.example.invalid"
EMAIL_PROVIDER = "disabled"
EMAIL_FROM = "Example Anmeldung <noreply@example.invalid>"
EMAIL_REPLY_TO = "Example Anmeldung <reply@example.invalid>"
TURNSTILE_SITE_KEY = "replace-me"
AUTH_PUBLIC_ENABLED = "false"
PRIVACY_NOTICE_VERSION = "replace-with-approved-notice-version"
AUTH_VERIFICATION_TTL_SECONDS = "86400"
AUTH_RESET_TTL_SECONDS = "3600"
AUTH_EMAIL_CHANGE_TTL_SECONDS = "86400"
AUTH_SESSION_TTL_SECONDS = "604800"
AUTH_RESEND_COOLDOWN_SECONDS = "60"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "60"
AUTH_RATE_LIMIT_MAX_ATTEMPTS = "5"
AUTH_PASSWORD_MIN_LENGTH = "12"
AUTH_PASSWORD_MAX_LENGTH = "128"
EMAIL_MAX_ATTEMPTS = "5"
DEFAULT_GROUP_CAPACITY = "12"
DEFAULT_DANCE_CAPACITY = "15"
INDIVIDUAL_PRICE_CENTS_PER_45_MIN = "3000"
GROUP_DURATION_FALLBACK_MINUTES = "90"
MISSING_DURATION_YEARLY_CENTS_PER_45_MIN = "2300"
MISSING_DURATION_MONTHLY_CENTS_PER_45_MIN = "3000"
PRICE_QUOTE_TTL_SECONDS = "86400"
DOCUMENT_UPLOAD_ENABLED = "false"
DOCUMENT_MAX_FILE_BYTES = "10485760"
DOCUMENT_MAX_FILES_PER_AUTHORIZATION = "5"
DOCUMENT_MAX_AUTHORIZATION_BYTES = "26214400"
DOCUMENT_UPLOAD_RATE_LIMIT_WINDOW_SECONDS = "60"
DOCUMENT_UPLOAD_RATE_LIMIT_MAX_ATTEMPTS = "5"
DOCUMENT_AV_ATTESTATION_TEXT_VERSION = "manual-local-av-v1"
CONTRACT_PDF_MAX_HTML_BYTES = "2097152"
CONTRACT_PDF_MAX_BYTES = "10485760"
BROWSER_RUN_DAILY_BUDGET_MS = "540000"
TELEGRAM_BUSINESS_TIMEZONE = "Europe/Berlin"
TELEGRAM_BUSINESS_HOURS = "Mo-Fr 09:00-17:00"

[[d1_databases]]
binding = "DB"
database_name = "reg-allgemein-db"
database_id = "replace-me"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "reg-allgemein-documents"
preview_bucket_name = "reg-allgemein-documents-preview"

# Secrets:
# JWT_SECRET
# TURNSTILE_SECRET_KEY
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID
