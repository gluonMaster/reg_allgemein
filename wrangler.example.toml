# Copy to wrangler.toml after creating Cloudflare resources.
# Do not commit real database ids, bucket names for production, or secrets.

#:schema node_modules/wrangler/config-schema.json
name = "reg-allgemein"
main = "src/worker.ts"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".svelte-kit/cloudflare/assets"
binding = "ASSETS"

[browser]
binding = "BROWSER"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["* * * * *", "*/15 * * * *"]

[vars]
# Requests fail closed until every replace/example value is configured.
APP_ENV = "production"
PORTAL_PUBLIC_ORIGIN = "https://portal.example.invalid"
OFFICIAL_PRIVACY_URL = "https://www.kolibri-dresden.de/replace-with-approved-datenschutz-url"
OFFICIAL_IMPRINT_URL = "https://www.kolibri-dresden.de/replace-with-approved-impressum-url"
OFFICIAL_CONTACT_URL = "https://www.kolibri-dresden.de/replace-with-approved-kontakt-url"
OFFICIAL_LINKS_VERSION = "replace-with-approved-links-version"
EMAIL_PROVIDER = "disabled"
EMAIL_FROM = "Kinder- und Elternzentrum Kolibri e.V. <registration@kolibri-dresden.de>"
EMAIL_REPLY_TO = "registration@kolibri-dresden.de"
TURNSTILE_SITE_KEY = "replace-me"
TURNSTILE_HOSTNAMES = "portal.example.invalid"
AUTH_PUBLIC_ENABLED = "false"
PRIVACY_NOTICE_VERSION = "replace-with-approved-notice-version"
AUTH_VERIFICATION_TTL_SECONDS = "86400"
AUTH_RESET_TTL_SECONDS = "3600"
AUTH_EMAIL_CHANGE_TTL_SECONDS = "86400"
AUTH_SESSION_TTL_SECONDS = "604800"
AUTH_RESEND_COOLDOWN_SECONDS = "60"
AUTH_RATE_LIMIT_WINDOW_SECONDS = "60"
AUTH_RATE_LIMIT_MAX_ATTEMPTS = "5"
AUTH_PASSWORD_MIN_LENGTH = "12"
AUTH_PASSWORD_MAX_LENGTH = "128"
EMAIL_MAX_ATTEMPTS = "5"
OUTBOX_LEASE_SECONDS = "60"
OUTBOX_RETRY_BASE_SECONDS = "60"
OUTBOX_RETRY_MAX_SECONDS = "3600"
# Safe default. Set bot_api only after the separately authorized provider gate.
TELEGRAM_PROVIDER = "disabled"
TELEGRAM_MAX_ATTEMPTS = "5"
TELEGRAM_CHAT_TYPE = "channel"
TELEGRAM_BOT_API_TIMEOUT_MS = "10000"
# Set to the reviewed preview/production activation instant immediately before enablement.
# Rows created before this UTC cutoff are never dispatched automatically.
# TELEGRAM_ACTIVATION_AT = "2099-01-01T00:00:00.000Z"
DEFAULT_GROUP_CAPACITY = "12"
DEFAULT_DANCE_CAPACITY = "15"
INDIVIDUAL_PRICE_CENTS_PER_45_MIN = "3000"
GROUP_DURATION_FALLBACK_MINUTES = "90"
MISSING_DURATION_YEARLY_CENTS_PER_45_MIN = "2300"
MISSING_DURATION_MONTHLY_CENTS_PER_45_MIN = "3000"
PRICE_QUOTE_TTL_SECONDS = "86400"
DOCUMENT_UPLOAD_ENABLED = "false"
DOCUMENT_MAX_FILE_BYTES = "10485760"
DOCUMENT_MAX_FILES_PER_AUTHORIZATION = "5"
DOCUMENT_MAX_AUTHORIZATION_BYTES = "26214400"
DOCUMENT_UPLOAD_RATE_LIMIT_WINDOW_SECONDS = "60"
DOCUMENT_UPLOAD_RATE_LIMIT_MAX_ATTEMPTS = "5"
DOCUMENT_AV_ATTESTATION_TEXT_VERSION = "manual-local-av-v1"
CONTRACT_SEND_ENABLED = "false"
CONTRACT_PREVIEW_REVIEW_ENABLED = "false"
CONTRACT_RENDERER = "disabled"
CONTRACT_PDF_MAX_HTML_BYTES = "2097152"
CONTRACT_PDF_MAX_BYTES = "10485760"
CONTRACT_MAX_RENDER_ATTEMPTS = "3"
BROWSER_RUN_DAILY_BUDGET_MS = "540000"
MEDIA_ONLINE_GRANT_ENABLED = "false"
PUBLIC_CONTRACT_FUNCTIONS_ENABLED = "false"
PRIVACY_EXPORT_TTL_SECONDS = "3600"
SCHEDULED_JOBS_ENABLED = "true"
SCHEDULED_OUTBOX_BATCH_LIMIT = "25"
SCHEDULED_MAINTENANCE_BATCH_LIMIT = "50"
SCHEDULED_LEASE_SECONDS = "300"
TELEGRAM_BUSINESS_TIMEZONE = "Europe/Berlin"
TELEGRAM_BUSINESS_HOURS = "Mo-Fr 09:00-17:00"

[[d1_databases]]
binding = "DB"
database_name = "reg-allgemein-db"
database_id = "replace-me"

[[r2_buckets]]
binding = "R2_ARCHIVE"
bucket_name = "replace-with-private-eu-archive-bucket"
preview_bucket_name = "replace-with-private-eu-preview-archive-bucket"
jurisdiction = "eu"

[[r2_buckets]]
binding = "R2_QUARANTINE"
bucket_name = "replace-with-private-eu-quarantine-bucket"
preview_bucket_name = "replace-with-private-eu-preview-quarantine-bucket"
jurisdiction = "eu"

# Secrets:
# JWT_SECRET
# TURNSTILE_SECRET_KEY
# RESEND_API_KEY
# PREVIEW_EMAIL_RECIPIENT_HASHES is a preview-only non-secret comma-separated
# SHA-256 allowlist, or exact "*" for unrestricted recipients in an owner-approved
# Access-protected preview. It must be omitted from production configuration.
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID (exact signed-decimal value; never @username)
